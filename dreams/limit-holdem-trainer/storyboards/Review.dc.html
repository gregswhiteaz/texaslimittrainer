<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hand Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0F12}
:root{color-scheme:dark}
input,select,button{color:inherit;font-family:inherit}
a{color:#FF6B70}a:hover{color:#FF9A9D}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #0E0F12; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 24px; background: #1A1D22; border-bottom: 1px solid #343A43">
    <span style="font-size: 15px; font-weight: 600">Cash · 6 players · $4/$8 · Hand #133 finished</span>
    <a href="Report.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #4A515C; border-radius: 8px; color: #F2F3F5; text-decoration: none; font-size: 14px">Leave table</a>
  </header>
  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px">
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
      <div style="width: 100%; max-width: 640px; height: 320px; background: #2F6B4F; border: 14px solid #24543E; border-radius: 180px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #FFFFFF">
        <span style="font-size: 15px">Showdown: Ben shows K♦ 7♣, pair of kings</span>
        <span style="font-size: 20px; font-weight: 700">Ben wins $122</span>
        <span style="font-size: 14px; color: #D9EBE2">Board K♠ 9♦ 4♣ 2♥ 6♠</span>
      </div>
      <a href="Table.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 28px; background: #D7262E; color: #FFFFFF; border-radius: 10px; text-decoration: none; font-size: 16px; font-weight: 600">Deal next hand</a>
    </main>
    <aside style="flex: 1 1 400px; max-width: 480px; background: #1A1D22; border: 1px solid #343A43; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-labelledby="rev">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 id="rev" style="margin: 0; font-size: 18px; font-weight: 700">Hand #133 review</h2>
          <span style="font-size: 14px; color: #A7AEB8">You lost $48 · A♥ 9♠ in the cutoff · sample</span>
        </div>
        <button type="button" aria-label="Close review" style="min-width: 44px; min-height: 44px; border: 1px solid #343A43; background: #1A1D22; border-radius: 8px; color: #F2F3F5">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
        </button>
      </div>
      <sc-for list="{{steps}}" as="d" hint-placeholder-count="4">
        <div style="border: 1px solid #343A43; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="font-size: 13px; font-weight: 600; color: #A7AEB8">{{d.street}}</span>
            <span style="{{d.badge}}">{{d.grade}}</span>
          </div>
          <span style="font-size: 15px"><strong>You:</strong> {{d.you}} · <strong>Advice:</strong> {{d.advice}}</span>
          <span style="font-size: 13px; color: #C9CED6">{{d.numbers}}</span>
          <span style="font-size: 14px; color: #C9CED6">{{d.why}}</span>
        </div>
      </sc-for>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const b = (bg) => 'font-size: 12px; font-weight: 700; color: #FFFFFF; background: ' + bg + '; padding: 3px 10px; border-radius: 12px';
return { steps: [
{ street: 'PREFLOP', grade: 'Correct', badge: b('#2F6FE0'), you: 'Raise', advice: 'Raise', numbers: 'A9 offsuit from the cutoff is in the opening range.', why: 'With only three players left to act, A9 is strong enough to raise first in.' },
{ street: 'FLOP · K♠ 9♦ 4♣', grade: 'Correct', badge: b('#2F6FE0'), you: 'Raise', advice: 'Raise', numbers: 'Pot odds need 12% · your equity about 58%', why: 'Middle pair with an ace kicker is ahead of most hands a calling station bets.' },
{ street: 'TURN · 2♥', grade: 'Minor error', badge: b('#9A5B00'), you: 'Bet', advice: 'Check', numbers: 'Ben called the flop raise: his likely hands now favour a king · your equity about 31%', why: 'When a calling station calls a raise, he usually has a better pair. Checking keeps the pot small.' },
{ street: 'RIVER · 6♠', grade: 'Major error', badge: b('#A3151C'), you: 'Raise', advice: 'Call', numbers: 'Pot odds need 15% · your equity about 18% · raising only gets called by better hands', why: 'Raising for value needs worse hands to call. Ben only continues with kings here, so call and see the showdown.' }
] };
}
}
</script>
</body>
</html>
