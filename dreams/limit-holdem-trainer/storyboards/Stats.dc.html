<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statistics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0F12}
:root{color-scheme:dark}
input,select,button{color:inherit;font-family:inherit}
a{color:#FF6B70}a:hover{color:#FF9A9D}
</style>
</helmet>
<div style="min-height: 960px; box-sizing: border-box; background: #0E0F12; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; padding: 32px 16px">
  <div style="max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <a href="Home.dc.html" style="font-size: 14px">← Home</a>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Statistics</h1>
      <span style="font-size: 14px; color: #A7AEB8">1,840 hands over 9 sessions · sample data</span>
    </header>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Table size
        <select style="min-height: 44px; font-size: 14px; padding: 0 10px; border: 1px solid #4A515C; border-radius: 8px; background: #1A1D22"><option>All</option><option>Heads-up</option><option selected>6-max</option><option>Full ring</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Game type
        <select style="min-height: 44px; font-size: 14px; padding: 0 10px; border: 1px solid #4A515C; border-radius: 8px; background: #1A1D22"><option selected>All</option><option>Cash</option><option>Sit-and-go</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600">Group by
        <select style="min-height: 44px; font-size: 14px; padding: 0 10px; border: 1px solid #4A515C; border-radius: 8px; background: #1A1D22"><option selected>Session</option><option>Every 100 hands</option><option>Day</option></select>
      </label>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 24px">
      <sc-for list="{{charts}}" as="c" hint-placeholder-count="2">
        <section style="flex: 1 1 460px; background: #1A1D22; border: 1px solid #343A43; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{c.title}}</h2>
            <span style="font-size: 13px; color: #A7AEB8">{{c.goal}}</span>
          </div>
          <svg viewBox="0 0 400 160" style="width: 100%; height: 180px" role="img" aria-label="{{c.title}} trend, sample">
            <line x1="0" y1="150" x2="400" y2="150" stroke="#343A43" stroke-width="1"></line>
            <line x1="0" y1="{{c.targetY}}" x2="400" y2="{{c.targetY}}" stroke="#F0A030" stroke-width="1.5" stroke-dasharray="6 5"></line>
            <polyline points="{{c.points}}" fill="none" stroke="#6EA8FF" stroke-width="3" stroke-linejoin="round"></polyline>
          </svg>
          <span style="font-size: 13px; color: #C9CED6">{{c.note}}</span>
        </section>
      </sc-for>
    </div>
    <section style="background: #1A1D22; border: 1px solid #343A43; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px" aria-labelledby="st">
      <h2 id="st" style="margin: 0; font-size: 16px; font-weight: 600">Style stats in healthy range (goal: 4 of 5)</h2>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{styleNow}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 4px; border: 1px solid #2A2F37; border-radius: 8px; padding: 10px">
            <span style="font-size: 13px; color: #A7AEB8">{{s.n}}</span>
            <span style="font-size: 20px; font-weight: 700">{{s.v}}</span>
            <span style="{{s.st}}">{{s.t}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const ok = 'font-size: 12px; font-weight: 600; color: #6EA8FF', bad = 'font-size: 12px; font-weight: 600; color: #F0A030';
return {
charts: [
{ title: 'Major errors per 100 hands', goal: 'Dashed line: half your first-1,000 rate (G-2)', targetY: 105, points: '0,40 50,48 100,44 150,62 200,70 250,78 300,86 350,95 400,98', note: 'Lower is better.' },
{ title: 'Big bets won per 100 hands', goal: 'Dashed line: break-even (G-3)', targetY: 90, points: '0,130 50,118 100,124 150,104 200,100 250,92 300,84 350,88 400,76', note: 'Above the dashed line means you are winning against this line-up.' }
],
styleNow: [
{ n: 'VPIP', v: '31%', t: 'too high', st: bad },
{ n: 'PFR', v: '18%', t: 'in range', st: ok },
{ n: 'Aggression', v: '42%', t: 'in range', st: ok },
{ n: 'Went to showdown', v: '30%', t: 'in range', st: ok },
{ n: 'Won at showdown', v: '50%', t: 'in range', st: ok }
]
};
}
}
</script>
</body>
</html>
